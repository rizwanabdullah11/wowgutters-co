<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1634" />
      <stop offset="50%" stop-color="#0f2347" />
      <stop offset="100%" stop-color="#0b1f3f" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19C58B" />
      <stop offset="100%" stop-color="#14B27D" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0b1634" stop-opacity="0" />
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" />
  <circle cx="300" cy="150" r="220" fill="url(#glow)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="320" x2="600" y2="320" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
  </g>

  <!-- Top WOW Gutters Header Ribbon -->
  <g transform="translate(300, 36)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text text-anchor="middle" y="5" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" letter-spacing="2">
      WOW GUTTERS LTD • TEAM
    </text>
  </g>

  <!-- Central Avatar Circle -->
  <g transform="translate(300, 160)" filter="url(#dropShadow)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="470" />
    <!-- Avatar Base -->
    <circle cx="0" cy="0" r="70" fill="url(#badgeGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
    
    <!-- Specialist Silhouette & Water Jet Icon -->
    <g transform="translate(0, -5)">
      <!-- Head / Cap -->
      <ellipse cx="0" cy="-20" rx="20" ry="22" fill="#e2e8f0" />
      <path d="M -24 -24 C -24 -36 24 -36 24 -24 L 30 -22 L 30 -28 L -24 -28 Z" fill="#38bdf8" />
      <!-- High Pressure Spray Nozzle -->
      <line x1="16" y1="12" x2="40" y2="-20" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
      <!-- Water Droplets / Mist -->
      <circle cx="44" cy="-26" r="3" fill="#38bdf8" />
      <circle cx="50" cy="-20" r="2" fill="#38bdf8" />
      <circle cx="48" cy="-32" r="2" fill="#38bdf8" />
      <!-- Shoulders & Uniform -->
      <path d="M -42 42 C -42 12 -22 0 0 0 C 22 0 42 12 42 42 Z" fill="#334155" />
      <path d="M -20 10 L 0 35 L 20 10" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Verified Badge Icon Overlay -->
    <g transform="translate(48, 48)">
      <circle cx="0" cy="0" r="18" fill="#38bdf8" stroke="#0b1634" stroke-width="3" />
      <path d="M -7 0 L -2 5 L 7 -4" fill="none" stroke="#0b1634" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Member Information Box -->
  <g transform="translate(300, 275)" text-anchor="middle">
    <!-- Name -->
    <text y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="0.5">
      David R.
    </text>
    <!-- Role -->
    <text y="28" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="1">
      HOT WASH &amp; EXTERIOR SPECIALIST
    </text>
  </g>

  <!-- Bottom Verification Pill -->
  <g transform="translate(300, 350)">
    <rect x="-170" y="-18" width="340" height="36" rx="18" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.5" />
    <text text-anchor="middle" y="5" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" letter-spacing="0.5">
      ✨ Purified Hot-Wash &amp; UPVC Certified
    </text>
  </g>
</svg>
